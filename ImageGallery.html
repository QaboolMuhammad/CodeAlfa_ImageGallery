<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Image Gallery</title>
  <link rel="stylesheet" href="ImageGallery.css">
</head>
<body>

<h1> Image Gallery</h1>

<div class="filters">
  <button onclick="filterImages('all')">All</button>
  <button onclick="filterImages('nature')">Nature</button>
  <button onclick="filterImages('city')">City</button>
</div>

<div class="gallery" id="gallery">
  <img src="https://picsum.photos/id/1015/400/300" class="nature">
  <img src="https://picsum.photos/id/1011/400/300" class="nature">
  <img src="https://picsum.photos/id/1013/400/300" class="nature">
  <img src="https://picsum.photos/id/1014/400/300" class="nature">
  <img src="https://picsum.photos/id/1016/400/302" class="nature">
  <img src="https://picsum.photos/id/1023/400/300" class="nature">
  <img src="https://picsum.photos/id/1012/400/300" class="city">
  <img src="https://picsum.photos/id/1019/400/300" class="city">
    <img src="https://picsum.photos/id/1018/400/300" class="city">
      <img src="https://picsum.photos/id/1010/400/300" class="city">
        <img src="https://picsum.photos/id/1021/400/300" class="city">
  <img src="https://picsum.photos/id/1016/400/300" class="nature">
</div>

<div class="lightbox" id="lightbox">
  <img id="lightbox-img">
  <div class="controls">
    <button onclick="prevImage()">⟨</button>
    <button onclick="nextImage()">⟩</button>
    <button onclick="closeLightbox()">✖</button>
  </div>
</div>

<script>
  const images = document.querySelectorAll('.gallery img');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  let currentIndex = 0;

  images.forEach((img, index) => {
    img.addEventListener('click', () => {
      lightbox.style.display = 'flex';
      lightboxImg.src = img.src;
      currentIndex = index;
    });
  });

  function closeLightbox() {
    lightbox.style.display = 'none';
  }

  function nextImage() {
    currentIndex = (currentIndex + 1) % images.length;
    lightboxImg.src = images[currentIndex].src;
  }

  function prevImage() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    lightboxImg.src = images[currentIndex].src;
  }

  function filterImages(category) {
    images.forEach(img => {
      if (category === 'all' || img.classList.contains(category)) {
        img.style.display = 'block';
      } else {
        img.style.display = 'none';
      }
    });
  }
</script>

</body>
</html>
